services:
  locust:
    container_name: locust
    image: locustio/locust
    ports:
      - '8089:8089'
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --host http://host.docker.internal:3000
    networks:
      - app_network

networks:
  app_network:
    external: true
    name: sample-app-main_default