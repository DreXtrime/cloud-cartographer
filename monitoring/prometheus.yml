global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'docker-stats'
    static_configs:
      - targets: ['docker-stats:9487']
    relabel_configs:
      - source_labels: [container_name]
        target_label: container

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'loki'
    static_configs:
      - targets: [ 'loki:3100' ]
    metrics_path: '/metrics'